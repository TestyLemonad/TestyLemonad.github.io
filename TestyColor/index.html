<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestyColor — Палитра</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lemon-yellow: #ffd700;
            --deep-orange: #ff8c00;
            --dark-bg: #050200;
            --card-bg: rgba(20, 10, 5, 0.45);
            --grid-line: rgba(255, 255, 255, 0.028);
            --grid-size: 48px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: #fff7ed;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Прячем системный курсор только когда кастомный реально активен */
        @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
            body.has-custom-cursor * { cursor: none !important; }
        }

        /* ============ ФОН: сетка ============ */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-color: var(--dark-bg);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            background-position: -1px -1px;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 92%);
            mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 92%);
        }
        .bg-grid::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 35%, rgba(255, 170, 40, 0.06) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        /* ============ ФОН: плавающие пиксели ============ */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .pixel {
            position: absolute;
            display: block;
            background: rgba(255, 210, 90, 0.9);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(255, 190, 60, 0.35);
            animation: pixel-drift ease-in-out infinite alternate;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }
        @keyframes pixel-drift {
            0%   { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(var(--dx, 18px), var(--dy, -26px), 0); }
        }

        /* ============ Ripple ============ */
        .ripple-obj {
            position: fixed;
            background: rgba(250, 204, 21, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes ripple-anim {
            to { transform: scale(8); opacity: 0; }
        }

        /* ============ Кастомный курсор ============ */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            will-change: transform;
            transform: translate3d(-100px, -100px, 0);
        }
        .cursor-inner {
            width: 100%;
            height: 100%;
            background: rgba(250, 204, 21, 0.3);
            border: 1px solid var(--lemon-yellow);
            border-radius: 50%;
            transition: transform 0.2s ease-out, background 0.3s ease, border 0.3s ease;
        }
        .cursor-hover .cursor-inner {
            transform: scale(2.5);
            background: rgba(250, 204, 21, 0.1);
            border-color: #fff;
        }

        /* ============ Виньетка и noise ============ */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle, transparent 45%, rgba(0,0,0,0.75) 100%);
        }

        .noise::before {
            content: "";
            position: fixed;
            inset: 0;
            opacity: 0.025;
            z-index: 3;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* ============ Liquid Glass ============ */
        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8, 4, 2, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.08);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                        border-color 0.4s ease,
                        background 0.4s ease,
                        box-shadow 0.4s ease;
            position: relative;
        }

        .glass-input {
            background: rgba(15, 8, 3, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: var(--lemon-yellow);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
            background: rgba(25, 12, 5, 0.8);
        }

        .content-wrapper { position: relative; z-index: 10; }

        .gradient-text {
            background: linear-gradient(135deg, var(--lemon-yellow) 10%, var(--deep-orange) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scroll-progress {
            position: fixed;
            top: 0; left: 0;
            width: 0%; height: 3px;
            background: linear-gradient(90deg, var(--lemon-yellow), var(--deep-orange));
            z-index: 90;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: #2d1a05; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--deep-orange); }

        .color-canvas {
            cursor: crosshair;
            touch-action: none;
        }
        .slider-hue {
            background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
        }
        .custom-shadow {
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.45);
        }
        .history-item:hover .delete-btn {
            display: flex;
        }
        .check-icon {
            display: none;
        }
        .copied .check-icon {
            display: block;
        }
        .copied .copy-icon {
            display: none;
        }
    </style>
</head>

    <script>
        let state = {
            h: 0,
            s: 100,
            v: 100,
            a: 1,
            history: JSON.parse(localStorage.getItem('colorHistory') || '[]')
        };

        const canvas = document.getElementById('color-canvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');
        const hueSlider = document.getElementById('hue-slider');
        const alphaSlider = document.getElementById('alpha-slider');
        const pickerCursor = document.getElementById('picker-cursor');
        const mainPreview = document.getElementById('main-preview');
        const historyList = document.getElementById('history-list');

        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let i = Math.floor(h / 60);
            let f = h / 60 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            let r, g, b;
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsv(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            let d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, v: v * 100 };
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function rgbToCmyk(r, g, b) {
            let c = 1 - (r / 255);
            let m = 1 - (g / 255);
            let y = 1 - (b / 255);
            let k = Math.min(c, Math.min(m, y));
            if (k === 1) return { c: 0, m: 0, y: 0, k: 100 };
            c = Math.round(((c - k) / (1 - k)) * 100);
            m = Math.round(((m - k) / (1 - k)) * 100);
            y = Math.round(((y - k) / (1 - k)) * 100);
            k = Math.round(k * 100);
            return { c, m, y, k };
        }

        function getLuminance(r, g, b) {
            let [rs, gs, bs] = [r, g, b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }

        function getContrastRatio(l1, l2) {
            let brightest = Math.max(l1, l2);
            let darkest = Math.min(l1, l2);
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function drawCanvas() {
            const width = canvas.width = canvasContainer.offsetWidth;
            const height = canvas.height = canvasContainer.offsetHeight;

            ctx.fillStyle = `hsl(${state.h}, 100%, 50%)`;
            ctx.fillRect(0, 0, width, height);

            let gradientWhite = ctx.createLinearGradient(0, 0, width, 0);
            gradientWhite.addColorStop(0, 'rgba(255,255,255,1)');
            gradientWhite.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradientWhite;
            ctx.fillRect(0, 0, width, height);

            let gradientBlack = ctx.createLinearGradient(0, 0, 0, height);
            gradientBlack.addColorStop(0, 'rgba(0,0,0,0)');
            gradientBlack.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = gradientBlack;
            ctx.fillRect(0, 0, width, height);
        }

        function updateUI() {
            const rgb = hsvToRgb(state.h, state.s, state.v);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            const cmyk = rgbToCmyk(rgb.r, rgb.g, rgb.b);
            const colorWithAlpha = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${state.a})`;

            // Update Preview
            mainPreview.style.backgroundColor = colorWithAlpha;
            pickerCursor.style.left = `${state.s}%`;
            pickerCursor.style.top = `${100 - state.v}%`;
            pickerCursor.style.backgroundColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            
            // Update Inputs
            document.getElementById('input-hex').value = hex;
            document.getElementById('input-rgb').value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            document.getElementById('input-hsl').value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            document.getElementById('input-cmyk').value = `${cmyk.c}, ${cmyk.m}, ${cmyk.y}, ${cmyk.k}`;
            
            // Contrast
            const lum = getLuminance(rgb.r, rgb.g, rgb.b);
            const ratioWhite = getContrastRatio(lum, 1).toFixed(2);
            const ratioBlack = getContrastRatio(lum, 0).toFixed(2);
            
            document.getElementById('ratio-white').innerText = `${ratioWhite}:1`;
            document.getElementById('ratio-black').innerText = `${ratioBlack}:1`;
            document.getElementById('contrast-box-white').style.backgroundColor = hex;
            document.getElementById('contrast-box-white').style.color = '#FFFFFF';
            document.getElementById('contrast-box-black').style.backgroundColor = hex;
            document.getElementById('contrast-box-black').style.color = '#000000';

            updateSchemes(state.h, state.s, state.v);
            alphaSlider.style.color = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        }

        function updateSchemes(h, s, v) {
            const renderScheme = (containerId, angles) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                angles.forEach(angle => {
                    const newH = (h + angle + 360) % 360;
                    const rgb = hsvToRgb(newH, s, v);
                    const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
                    const el = document.createElement('div');
                    el.className = 'flex-1 cursor-pointer hover:opacity-90 transition-opacity';
                    el.style.backgroundColor = hex;
                    el.title = hex;
                    el.onclick = () => setColorFromHex(hex);
                    container.appendChild(el);
                });
            };

            renderScheme('scheme-complementary', [0, 180]);
            renderScheme('scheme-analogous', [-30, 0, 30]);
            renderScheme('scheme-triad', [0, 120, 240]);
        }

        function setColorFromHex(hex) {
            const rgb = hexToRgb(hex);
            if (rgb) {
                const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
                state.h = hsv.h;
                state.s = hsv.s;
                state.v = hsv.v;
                hueSlider.value = hsv.h;
                drawCanvas();
                updateUI();
            }
        }

        function handleCanvasInteraction(e) {
            const rect = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));
            
            state.s = (x / rect.width) * 100;
            state.v = 100 - (y / rect.height) * 100;
            
            updateUI();
        }

        let isDragging = false;
        canvasContainer.addEventListener('mousedown', (e) => { isDragging = true; handleCanvasInteraction(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleCanvasInteraction(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        canvasContainer.addEventListener('touchstart', (e) => { isDragging = true; handleCanvasInteraction(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if (isDragging) handleCanvasInteraction(e); }, {passive: false});
        window.addEventListener('touchend', () => { isDragging = false; });

        hueSlider.addEventListener('input', (e) => {
            state.h = parseInt(e.target.value);
            drawCanvas();
            updateUI();
        });

        alphaSlider.addEventListener('input', (e) => {
            state.a = e.target.value / 100;
            updateUI();
        });

        document.getElementById('input-hex').addEventListener('change', (e) => {
            setColorFromHex(e.target.value);
        });

        function saveHistory() {
            const rgb = hsvToRgb(state.h, state.s, state.v);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
            if (!state.history.includes(hex)) {
                state.history.unshift(hex);
                if (state.history.length > 20) state.history.pop();
                localStorage.setItem('colorHistory', JSON.stringify(state.history));
                renderHistory();
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            state.history.forEach(hex => {
                const item = document.createElement('div');
                item.className = 'history-item relative group w-10 h-10 rounded-lg cursor-pointer shadow-sm border border-white/20 transition-transform hover:scale-110';
                item.style.backgroundColor = hex;
                item.onclick = () => setColorFromHex(hex);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] hidden items-center justify-center';
                deleteBtn.innerHTML = '×';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    state.history = state.history.filter(h => h !== hex);
                    localStorage.setItem('colorHistory', JSON.stringify(state.history));
                    renderHistory();
                };
                
                item.appendChild(deleteBtn);
                historyList.appendChild(item);
            });
        }

        document.getElementById('add-to-history').onclick = saveHistory;
        document.getElementById('clear-history').onclick = () => {
            state.history = [];
            localStorage.removeItem('colorHistory');
            renderHistory();
        };

        function copyToClipboard(id) {
            const input = document.getElementById(id);
            const btn = input.nextElementSibling;
            
            const temp = document.createElement('textarea');
            temp.value = input.value;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 2000);
        }

        window.onload = () => {
            drawCanvas();
            updateUI();
            renderHistory();
        };

        window.onresize = drawCanvas;
    </script>

    <!-- Футер -->
    <footer class="w-full px-6 py-8 sm:py-12 border-t border-white/5 text-center mt-auto bg-black/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto flex flex-col items-center gap-4">
            <div class="w-12 h-px bg-gradient-to-r from-transparent via-orange-500 to-transparent mb-2" aria-hidden="true"></div>
            <p class="mono text-[10px] sm:text-xs text-orange-100/60 tracking-widest uppercase px-4">
                &copy; 2026 testylemonad. сделано с помощью кода и лимонада.
            </p>
        </div>
    </footer>

    <script type="module">
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isDesktop = window.matchMedia('(min-width: 1024px) and (hover: hover) and (pointer: fine)').matches;

        // ===== ФОН: генерация пикселей =====
        (function buildParticles() {
            const container = document.getElementById('bg-particles');
            if (!container) return;
            const isMobile = window.matchMedia('(max-width: 767px)').matches;
            const count = isMobile ? 24 : 46;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const p = document.createElement('span');
                p.className = 'pixel';
                const size = Math.random() < 0.72 ? 2 : 3;
                const dx = (Math.random() * 40 - 20).toFixed(1);
                const dy = (-20 - Math.random() * 30).toFixed(1);
                const duration = (10 + Math.random() * 14).toFixed(1);
                const delay = (-Math.random() * 20).toFixed(1);
                const opacity = (0.25 + Math.random() * 0.6).toFixed(2);
                p.style.left = (Math.random() * 100).toFixed(2) + '%';
                p.style.top  = (Math.random() * 100).toFixed(2) + '%';
                p.style.width  = size + 'px';
                p.style.height = size + 'px';
                p.style.opacity = opacity;
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = delay + 's';
                if (reduceMotion) p.style.animation = 'none';
                frag.appendChild(p);
            }
            container.appendChild(frag);
        })();

        // ===== Ripple =====
        if (!reduceMotion) {
            document.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                const size = 100;
                const ripple = document.createElement('div');
                ripple.className = 'ripple-obj';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - size / 2) + 'px';
                ripple.style.top  = (e.clientY - size / 2) + 'px';
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 800);
            });
        }

        // ===== Кастомный курсор =====
        const cursor = document.getElementById('custom-cursor');
        if (cursor && isDesktop) {
            let mx = -100, my = -100;
            let cx = -100, cy = -100;
            let shown = false;
            const placeCursor = (x, y) => {
                cursor.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
            };
            document.addEventListener('mousemove', (e) => {
                mx = e.clientX;
                my = e.clientY;
                if (!shown) {
                    document.body.classList.add('has-custom-cursor');
                    cursor.style.display = 'block';
                    shown = true;
                }
                if (reduceMotion) placeCursor(mx, my);
            }, { passive: true });
            if (!reduceMotion) {
                (function loop() {
                    cx += (mx - cx) * 0.25;
                    cy += (my - cy) * 0.25;
                    placeCursor(cx, cy);
                    requestAnimationFrame(loop);
                })();
            }
            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
                document.body.classList.remove('has-custom-cursor');
                shown = false;
            });
            const HOVER_SEL = 'a, button, input, select, textarea, .glass-card';
            document.addEventListener('mouseover', (e) => {
                if (e.target.closest && e.target.closest(HOVER_SEL)) document.body.classList.add('cursor-hover');
            }, { passive: true });
            document.addEventListener('mouseout', (e) => {
                if (e.target.closest && e.target.closest(HOVER_SEL)) document.body.classList.remove('cursor-hover');
            }, { passive: true });
        }

        // ===== Прогресс скролла =====
        const scrollBar = document.getElementById('scroll-bar');
        function updateScroll() {
            const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
            scrollBar.style.width = pct + '%';
        }
        window.addEventListener('scroll', updateScroll, { passive: true });
    </script>
