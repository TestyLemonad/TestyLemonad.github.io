          transparent 92%

        mask-image: radial-gradient(
          circle at 50% 50%,
          #000 30%,
          transparent 92%
        );

        inset: 0;

            rgba(255, 170, 40, 0.06) 0%,
            transparent 55%

            'Назовите высочайшую точку России и укажите горную систему, в которой она расположена.',
            'Гора Эльбрус (5642 м), горная система — Большой Кавказ (Кавказские горы).',
            'btn-5-0',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-1"
        onclick="
          openModal(
            'Какая фундаментальная государственная программа («Стратегия...») направлена на сбалансированное развитие пространства России, включая сохранение наследия, развитие агломераций и геостратегических территорий?',
            'Стратегия пространственного развития Российской Федерации на период до 2025 года.',
            'btn-5-1',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-2"
        onclick="
          openModal(
            'Назовите временные рамки и исторические причины Первого демографического кризиса в России в XX веке.',
            '1914–1922 годы; причины: Первая мировая война, революция, Гражданская война, сопровождавшиеся разрухой, голодом и эмиграцией.',
            'btn-5-2',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-3"
        onclick="
          openModal(
            'Какой пролив разделяет остров Сахалин и японский остров Хоккайдо, по которому проходит морская граница России и Японии?',
            'Пролив Лаперуза.',
            'btn-5-3',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-4"
        onclick="
          openModal(
            'Через какой меридиан проходит условная международная «линия перемены дат»?',
            'Через 180-й меридиан (в 12-м часовом поясе).',
            'btn-5-4',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-5"
        onclick="
          openModal(
            'Какая уникальная «Федеральная территория» прямого федерального подчинения с экономической самостоятельностью была впервые создана на базе объектов Зимней Олимпиады 2014 года в Сочи?',
            'Первая федеральная территория «Сириус».',
            'btn-5-5',
          )
        "
      >
        60
      </div>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <div id="modal-question" class="modal-text"></div>
        <div id="modal-answer" class="modal-text" style="color: #00ff66"></div>
        <div class="controls">
          <button class="btn" onclick="showAnswer()">Показать ответ</button>
          <button class="btn" onclick="closeModal()">Закрыть</button>
        </div>
      </div>
    </div>

    <script>
      function initParticles() {
        const container = document.getElementById("particles");
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
          const pixel = document.createElement("div");
          pixel.className = "pixel";

          const size = Math.floor(Math.random() * 3) + 2;
          const posX = Math.random() * 100;
          const posY = Math.random() * 100;
          const dx = (Math.random() - 0.5) * 60;
          const dy = -(Math.random() * 40 + 10);
          const duration = Math.random() * 4 + 3;
          const delay = Math.random() * 5;

          pixel.style.width = size + "px";
          pixel.style.height = size + "px";
          pixel.style.left = posX + "%";
          pixel.style.top = posY + "%";
          pixel.style.setProperty("--dx", dx + "px");
          pixel.style.setProperty("--dy", dy + "px");
          pixel.style.animationDuration = duration + "s";
          pixel.style.animationDelay = delay + "s";

          container.appendChild(pixel);
        }
      }

      initParticles();

      let currentBtnId = null;
      let timerInterval = null;
      let timeLeft = 60;

      function renderMathIn(element) {
        if (window.renderMathInElement) {
          renderMathInElement(element, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
            throwOnError: false,
          });
        }
      }

      function startTimer() {
        stopTimer();
        timeLeft = 60;

        const timerBanner = document.getElementById("timer-banner");
        const timerText = document.getElementById("timer-text");

        timerBanner.classList.remove("warning");
        timerBanner.classList.add("active");
        timerText.innerText = "01:00";

        timerInterval = setInterval(() => {
          timeLeft--;
          const seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
          timerText.innerText = `00:${seconds}`;

          if (timeLeft <= 10 && timeLeft > 0) {
            timerBanner.classList.add("warning");
          }

          if (timeLeft <= 0) {
            stopTimer();
            timerText.innerText = "00:00";
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        const timerBanner = document.getElementById("timer-banner");
        timerBanner.classList.remove("active", "warning");
      }

      function openModal(question, answer, btnId) {
        currentBtnId = btnId;

        const answerElem = document.getElementById("modal-answer");
        const questionElem = document.getElementById("modal-question");

        answerElem.classList.remove("visible");
        answerElem.innerText = "";

        questionElem.innerText = question;
        answerElem.innerText = "Ответ: " + answer;

        // Рендерим LaTeX в вопросе
        renderMathIn(questionElem);

        document.getElementById("modal").classList.add("active");
        startTimer();
      }

      function showAnswer() {
        const answerElem = document.getElementById("modal-answer");
        answerElem.classList.add("visible");
        // Рендерим LaTeX в ответе
        renderMathIn(answerElem);
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        stopTimer();

        if (currentBtnId) {
          document.getElementById(currentBtnId).classList.add("used");
        }
      }
    </script>
  </body>
</html>
