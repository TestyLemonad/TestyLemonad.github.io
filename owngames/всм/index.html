      (function () {
        const secretPass = "3197"; // Укажи свой пароль
        const saved = sessionStorage.getItem("game_auth");

        if (saved !== secretPass) {
          const pass = prompt("Введи пароль для доступа к игре:");
          if (pass === secretPass) {
            sessionStorage.setItem("game_auth", secretPass);
          } else {
            alert("Неверный пароль!");
            window.stop();
            document.documentElement.innerHTML =
              "<body style='background:#111;color:#ff4444;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;'><h1>Доступ запрещён</h1></body>";

        }
      })();

      .modal-content {

      .btn {

        "
      >
        50
      </div>

      <div
        class="cell question-btn"
        id="btn-4-4"
        onclick="
          openModal(
            'Что делает операция set(list) над списком в программировании, если в нём были повторяющиеся значения?',
            'Преобразует список в множество, удаляя все повторяющиеся элементы.',
            'btn-4-4',
          )
        "
      >
        50
      </div>

      <div
        class="cell question-btn"
        id="btn-4-5"
        onclick="
          openModal(
            'Вероятность встретить на улице динозавра по шуточной логике «либо встречу, либо нет» — 50%. В чём математическая ошибка объединения этих событий?',
            'Эти события образуют полное множество, но они не являются равновероятными.',
            'btn-4-5',
          )
        "
      >
        50
      </div>

      <div
        class="cell question-btn"
        id="btn-5-0"
        onclick="
          openModal(
            'Скольким элементам равно пересечение множества простых чисел и множества чётных чисел? Назовите эти элементы.',
            'Одному элементу (число $2$).',
            'btn-5-0',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-1"
        onclick="
          openModal(
            'Как называется операция над множествами $A$ и $B$, результат которой содержит элементы, принадлежащие $A$ или $B$, но НЕ обоим одновременно?',
            'Симметрическая разность (обозначается $\\Delta$ или $\\oplus$).',
            'btn-5-1',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-2"
        onclick="
          openModal(
            'Запишите с помощью математических символов утверждение: «Множество натуральных чисел является строгим подмножеством множества целых чисел, а множество целых чисел — строгим подмножеством рациональных чисел».',
            '$\\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q}$.',
            'btn-5-2',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-3"
        onclick="
          openModal(
            'Множество $A$ состоит из двух элементов: $\\{1, 2\\}$. Перечислите абсолютно все подмножества данного множества и укажите их количество.',
            '$4$ подмножества: $\\varnothing$, $\\{1\\}$, $\\{2\\}$, $\\{1, 2\\}$.',
            'btn-5-3',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-4"
        onclick="
          openModal(
            'Как в базах данных (SQL) называется операция объединения таблиц, при которой в итоговый результат попадают только строки с совпадениями в обеих таблицах (аналог пересечения $A \\cap B$)?',
            'INNER JOIN.',
            'btn-5-4',
          )
        "
      >
        60
      </div>

      <div
        class="cell question-btn"
        id="btn-5-5"
        onclick="
          openModal(
            'Удивительный математический парадокс утверждающий, что трёхмерный шар можно распилить на конечное число частей и сложить из них два точно таких же шара. Назовите его.',
            'Парадокс Банаха — Тарского (Парадокс удвоения шара).',

    <div id="modal" class="modal">
      <div class="modal-content">
        <div id="modal-question" class="modal-text"></div>
        <div id="modal-answer" class="modal-text" style="color: #00ff66"></div>
        <div class="controls">
          <button class="btn" onclick="showAnswer()">Показать ответ</button>
          <button class="btn" onclick="closeModal()">Закрыть</button>
        </div>
      </div>
    </div>

    <script>
      function initParticles() {
        const container = document.getElementById("particles");
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
          const pixel = document.createElement("div");
          pixel.className = "pixel";

          const size = Math.floor(Math.random() * 3) + 2;
          const posX = Math.random() * 100;
          const posY = Math.random() * 100;
          const dx = (Math.random() - 0.5) * 60;
          const dy = -(Math.random() * 40 + 10);
          const duration = Math.random() * 4 + 3;
          const delay = Math.random() * 5;

          pixel.style.width = size + "px";
          pixel.style.height = size + "px";
          pixel.style.left = posX + "%";
          pixel.style.top = posY + "%";
          pixel.style.setProperty("--dx", dx + "px");
          pixel.style.setProperty("--dy", dy + "px");
          pixel.style.animationDuration = duration + "s";
          pixel.style.animationDelay = delay + "s";

          container.appendChild(pixel);
        }
      }

      initParticles();

      let currentBtnId = null;
      let timerInterval = null;
      let timeLeft = 60;

      function renderMathIn(element) {
        if (window.renderMathInElement) {
          renderMathInElement(element, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
            throwOnError: false,
          });
        }
      }

      function startTimer() {
        stopTimer();
        timeLeft = 60;

        const timerBanner = document.getElementById("timer-banner");
        const timerText = document.getElementById("timer-text");

        timerBanner.classList.remove("warning");
        timerBanner.classList.add("active");
        timerText.innerText = "01:00";

        timerInterval = setInterval(() => {
          timeLeft--;
          const seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
          timerText.innerText = `00:${seconds}`;

          if (timeLeft <= 10 && timeLeft > 0) {
            timerBanner.classList.add("warning");
          }

          if (timeLeft <= 0) {
            stopTimer();
            timerText.innerText = "00:00";
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        const timerBanner = document.getElementById("timer-banner");
        timerBanner.classList.remove("active", "warning");
      }

      function openModal(question, answer, btnId) {
        currentBtnId = btnId;

        const answerElem = document.getElementById("modal-answer");
        const questionElem = document.getElementById("modal-question");

        answerElem.classList.remove("visible");
        answerElem.innerText = "";

        questionElem.innerText = question;
        answerElem.innerText = "Ответ: " + answer;

        // Рендерим LaTeX в вопросе
        renderMathIn(questionElem);

        document.getElementById("modal").classList.add("active");
        startTimer();
      }

      function showAnswer() {
        const answerElem = document.getElementById("modal-answer");
        answerElem.classList.add("visible");
        // Рендерим LaTeX в ответе
        renderMathIn(answerElem);
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        stopTimer();

        if (currentBtnId) {
          document.getElementById(currentBtnId).classList.add("used");
        }
      }
    </script>
  </body>
</html>
